<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexim — Иконки</title>

  <link rel="icon" type="image/svg+xml" href="./favicon.svg">

  <!-- Те же версии, что в проде print-design/pr-diz.ru -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./flexim-overrides.css">

  <style>
    body { background: var(--background-bg); }

    .page-hero {
      background: var(--background-paper);
      border-bottom: 1px solid var(--other-lines);
      padding: 40px 0 28px;
    }
    .page-hero h1 {
      color: var(--primary-main);
      font: 700 30px/36px var(--font-family);
      margin: 0 0 8px;
    }
    .page-hero p { color: var(--text-secondary); font: 400 14px/20px var(--font-family); margin: 0; }
    .page-hero a { color: var(--primary-main); font-weight: 600; }
    .icon-back { display: inline-block; margin-bottom: 12px; }

    .icon-toolbar { padding: 24px 0 8px; }
    .icon-search {
      max-width: 360px;
      height: 40px;
      border: 1px solid var(--other-lines);
      border-radius: 8px;
      padding: 8px 12px;
      font: 400 14px/20px var(--font-family);
      color: var(--text-primary);
      background: var(--surface-white);
      width: 100%;
    }
    .icon-search:focus { outline: none; border: 2px solid var(--primary-light); }
    .icon-count { color: var(--text-secondary); font: 400 14px/20px var(--font-family); margin: 8px 0 0; }

    .icon-cat {
      font: 700 12px/14px var(--font-family);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: 28px 0 12px;
    }
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
    }
    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 8px;
      border: 1px solid var(--other-lines);
      border-radius: 12px;
      background: var(--background-paper);
      text-align: center;
      transition: box-shadow .15s, border-color .15s;
    }
    .icon-card:hover { box-shadow: var(--shadow-s); border-color: var(--surface-controls); }
    .icon-card__glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      color: var(--text-primary);
    }
    .icon-card:hover .icon-card__glyph { color: var(--primary-main); }
    .icon-card__name {
      font: 400 11px/14px var(--font-family);
      color: var(--text-secondary);
      word-break: break-word;
    }
    .icon-empty { color: var(--text-secondary); padding: 24px 0; }
    footer { padding: 32px 0; text-align: center; color: var(--text-tertiary); font: 400 12px/16px var(--font-family); }
  </style>
</head>
<body>

<header class="page-hero">
  <div class="container">
    <a href="./components.html" class="icon-back">← Назад в каталог</a>
    <h1>Flexim — Иконки</h1>
    <p>Все иконки дизайн-системы из реестра <code>design-system/icons</code>. Использование в разметке:
      <code>&lt;span data-flexim-icon="search" data-size="24"&gt;&lt;/span&gt;</code>.
    </p>
  </div>
</header>

<div class="container">
  <div class="icon-toolbar">
    <input type="search" id="icon-search" class="icon-search" placeholder="Поиск иконки по имени…" aria-label="Поиск иконки">
    <p class="icon-count" id="icon-count"></p>
  </div>
  <div id="icon-root"></div>
  <p class="icon-empty" id="icon-empty" style="display:none;">Ничего не найдено.</p>
</div>

<footer>
  Flexim · Принт-Дизайн · Иконки · стек Bootstrap 4.0.0 + jQuery 3.5.1
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="./icons/icons.js"></script>
<script>
  (function () {
    var root = document.getElementById('icon-root');
    var cats = window.fleximIcons.byCategory();
    var total = 0;

    Object.keys(cats).forEach(function (cat) {
      var heading = document.createElement('div');
      heading.className = 'icon-cat';
      heading.textContent = cat;
      root.appendChild(heading);

      var grid = document.createElement('div');
      grid.className = 'icon-grid';

      cats[cat].forEach(function (name) {
        total += 1;
        var card = document.createElement('div');
        card.className = 'icon-card';
        card.setAttribute('data-name', name);

        var glyph = document.createElement('span');
        glyph.className = 'icon-card__glyph';
        glyph.appendChild(window.fleximIcons.create(name, 24));

        var label = document.createElement('span');
        label.className = 'icon-card__name';
        label.textContent = name;

        card.appendChild(glyph);
        card.appendChild(label);
        grid.appendChild(card);
      });

      root.appendChild(grid);
    });

    document.getElementById('icon-count').textContent = 'Всего иконок: ' + total;

    // Рендер lucide-фолбэков (если у какой-то иконки нет встроенного SVG).
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }

    // Поиск по имени.
    var search = document.getElementById('icon-search');
    var empty = document.getElementById('icon-empty');
    search.addEventListener('input', function (e) {
      var q = e.target.value.trim().toLowerCase();
      var shown = 0;
      document.querySelectorAll('.icon-card').forEach(function (c) {
        var match = c.getAttribute('data-name').toLowerCase().indexOf(q) > -1;
        c.style.display = match ? '' : 'none';
        if (match) shown += 1;
      });
      // Скрываем пустые категории.
      document.querySelectorAll('.icon-grid').forEach(function (g) {
        var anyVisible = Array.prototype.some.call(g.children, function (c) { return c.style.display !== 'none'; });
        g.style.display = anyVisible ? '' : 'none';
        if (g.previousElementSibling && g.previousElementSibling.classList.contains('icon-cat')) {
          g.previousElementSibling.style.display = anyVisible ? '' : 'none';
        }
      });
      empty.style.display = shown === 0 ? '' : 'none';
    });
  })();
</script>
</body>
</html>
